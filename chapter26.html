<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Healing Page</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: #1a1a1a;
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }

      .slider-container {
        position: relative;
        width: 80%;
        max-width: 900px;
        height: 500px;
        background-color: #2c2c2c;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        overflow: hidden;
        padding: 5px;
      }

      .slide {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        padding: 50px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
        pointer-events: none;
      }

      .slide.active {
        opacity: 1;
        pointer-events: auto;
        padding: 25px;
      }
      .slide img {
        max-width: 100%;
        max-height: calc(100% - 60px);
        object-fit: contain;
        border-radius: 8px;
        margin-bottom: auto;
      }
      h1 {
        font-size: 2.5rem;
        margin-bottom: 20px;
        color: #4caf50;
      }
      p {
        font-size: 1.2rem;
        line-height: 1.6;
        max-width: 600px;
      }

      .controls {
        position: absolute;
        bottom: 20px;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 20px;
        z-index: 10;
      }

      button {
        background-color: #4caf50;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 1rem;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.2s;
        z-index: 50;
      }

      button:hover {
        background-color: #0e6312;
      }
      #toStart {
        background-color: #1b87f3;
      }
      #toStart:hover {
        background-color: #03386e;
      }

      @media (min-width: 1024px) {
        .slider-container {
          width: 95%;
          max-width: 1400px;
          height: 80vh;
          border-radius: 16px;
        }
        .slider-container:hover {
          width: 95%;
          max-width: 1400px;
          height: 90vh;
          border-radius: 16px;
        }

        .slide {
          padding: 40px;
        }

        .slide img {
          max-height: calc(100% - 80px);
        }

        .slider-container .slide img {
          transition: transform 0.3s ease-in-out;
          cursor: zoom-in;
        }

        .slider-container .slide img:hover {
          transform: scale(1.3);
          z-index: 30;
        }

        .slider-container .slide:nth-child(1) img {
          transition: transform 0.3s ease-in-out;
          cursor: zoom-in;
        }

        .slider-container .slide:nth-child(1) img:hover {
          transform: scale(1.5) translateY(-5%);
          z-index: 30;
        }
        button {
          padding: 15px 30px;
          font-size: 1.2rem;
        }
      }
    </style>
  </head>

      <div
        class="slide active"
        style="background-color: black; z-index: &quot;40&quot;"
      >
        <div class="intro">
          <h1>Willkommen zu den Healing Slides</h1>
          <br />
          <p>klicke einfach die Slides durch</p>
        </div>
      </div>
      <div class="controls">
        <button id="prevBtn">Zurück</button>
        <button id="nextBtn">Weiter</button>
        <button onclick="window.location.href = 'intro.html'" id="toStart">
          zurück zum Anfang
        </button>
      </div>
    </div>

    <script>
      const slides = document.querySelectorAll(".slide");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      let currentIndex = 0;

      function showSlide(index) {
        slides.forEach((slide) => slide.classList.remove("active"));
        slides[index].classList.add("active");
      }

      nextBtn.addEventListener("click", () => {
        currentIndex = (currentIndex + 1) % slides.length;
        showSlide(currentIndex);
      });

      prevBtn.addEventListener("click", () => {
        currentIndex = (currentIndex - 1 + slides.length) % slides.length;
        showSlide(currentIndex);
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") {
          nextBtn.click();
        } else if (e.key === "ArrowLeft") {
          prevBtn.click();
        }
      });
    </script>
